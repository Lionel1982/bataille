<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bataille de Po/ets</title><link rel="stylesheet" href="style.css"></head>
<body><div class="phone" id="phone">

<div class="screen on" id="build">
  <div class="bhead"><h1>BATAILLE DE PO/ETS</h1><div class="bud" id="bud"></div></div>
  <div class="bbody">
    <h2>1. Ton avatar</h2><div class="avrow" id="avatars"></div>
    <h2>2. Ton animal</h2><div class="grid" id="pets"></div>
    <h2>3. Tes fringues</h2><div class="opts" id="tops"></div><div class="opts" id="bottoms"></div>
    <h2>4. Ton deck <span style="font-size:12px;font-weight:400">(30 cartes, min. 8 🍖)</span></h2>
    <div class="deckbtns"><button id="suggestBtn">✨ Deck conseillé</button><button id="clearBtn">🗑️ Vider</button></div>
    <div id="deck"></div>
    <div class="toggles"><button id="soundBtn" class="tg">🔊 SON : ON</button><button id="fastBtn" class="tg">▶ RAPIDE : OFF</button><button id="pauseBtn" class="tg">▶ PAUSE : OFF</button></div>
    <div style="font-size:10px;opacity:.6;margin:3px 0 0">Pause ON = le jeu attend ton clic après chaque carte. Ton deck est sauvegardé automatiquement.</div>
  </div>
  <div class="bfoot"><button class="big" id="goBtn">⚔️ COMBATTRE !</button></div>
</div>

<div class="screen" id="fight">
  <div class="scene" id="scene">
    <div class="sky"></div><div class="house h1"></div><div class="house h2"></div><div class="house h3"></div><div class="road"></div>
    <div class="plat" style="left:150px;top:120px;width:150px;height:40px"></div>
    <div class="plat" style="left:-10px;top:214px;width:230px;height:70px"></div>
    <div class="ent" id="oppPet" style="left:150px;top:70px;width:130px;height:120px"></div>
    <div class="ent" id="oppPote" style="left:286px;top:16px;width:86px;height:140px"></div>
    <div class="ent me" id="myPet" style="left:4px;top:168px;width:150px;height:150px;z-index:7"></div>
    <div class="ent" id="myPote" style="left:150px;top:208px;width:220px;height:160px;z-index:6;overflow:hidden"></div>
    <div class="res"><div class="tok" id="tokFood">🍖</div><div class="num" id="foodTxt">0</div><div class="tok" style="border-color:#ff73c8">🥤</div><div class="pips" id="sodaPips"></div></div>
    <div class="hpbox" style="left:8px;top:52px"><div class="top"><span id="oppName"></span><span id="oppHpTxt"></span></div><div class="hpbar"><div class="hpfill" id="oppHp"></div></div><div class="st" id="oppSt"></div></div>
    <div class="hpbox" style="right:8px;bottom:8px"><div class="top"><span id="myName"></span><span id="myHpTxt"></span></div><div class="hpbar"><div class="hpfill" id="myHp"></div></div><div class="st" id="mySt"></div></div>
  </div>
  <div class="mid">
    <div class="dialog"><span class="turn" id="turnTag"></span><span id="msg"></span><button id="cont">SUITE ▶</button></div>
    <div class="row">
      <div class="stack"><div class="pile" id="deckN"></div>Pioche</div>
      <div class="stack"><div class="slots" id="pocketSlots"></div>👖 Poches</div>
      <div class="stack"><div class="pile disc" id="discN"></div>Défausse</div>
      <button id="endBtn">FIN DU<br>TOUR ▶</button>
    </div>
  </div>
  <div class="handzone"><div class="actbar" id="actbar"></div><div id="hand"></div></div>
</div>

</div>
<script src="assets.js"></script><script src="data.js"></script><script src="sfx.js"></script><script src="build.js"></script><script src="fx.js"></script><script src="game.js"></script><script src="ui.js"></script>
</body></html>
